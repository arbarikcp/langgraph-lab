[project]
name = "langgraph-lab"
version = "0.1.0"
description = "Hands-on LangGraph curriculum: graphs, agents, harnesses and deep agents"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.34",
    "langchain>=1.4.9",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-cli[inmem]>=0.4.42",
    "langsmith>=0.14.17",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["common", "chapters", "capstones"]
python_files = ["test_*.py"]
